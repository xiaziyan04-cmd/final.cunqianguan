<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>小特安存钱罐 · 桌面App数据急救</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f7f4ef;color:#222;margin:0;padding:18px}
.wrap{max-width:760px;margin:auto}
h1{font-size:22px;margin:0 0 8px}
.warn{background:#fff3cd;border:1px solid #ffe69c;padding:12px;border-radius:12px;line-height:1.6}
.info{background:white;border:1px solid #ddd;border-radius:12px;padding:12px;margin-top:12px;font-size:13px;word-break:break-all}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
button{border:0;border-radius:10px;padding:12px;font-size:14px;font-weight:700}
.primary{background:#d1262d;color:white}
.secondary{background:#fff;border:1px solid #ccc;color:#333}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;margin:12px 0;padding:14px}
.key{font-weight:800;color:#b11f26;word-break:break-all}
.meta{font-size:12px;color:#666;margin-top:6px;line-height:1.6}
pre{background:#f6f6f6;border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;font-size:11px}
.good{color:#18794e;font-weight:700}
.bad{color:#b42318;font-weight:700}
.small{font-size:12px;color:#666;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛟 小特安存钱罐 · 桌面 App 数据急救</h1>
  <div class="warn">
    <b>重要：</b>这个页面本身不会自动修改任何 localStorage。<br>
    请务必从你<strong>原来一直使用的桌面图标</strong>打开本页，而不是从 Safari/Chrome 地址栏打开。
  </div>

  <div class="info" id="env"></div>

  <div class="actions">
    <button class="primary" onclick="exportAll()">① 导出当前容器全部数据</button>
    <button class="secondary" onclick="scan()">② 重新扫描</button>
  </div>

  <div id="summary" class="info"></div>
  <div id="list"></div>
</div>

<script>
const OFFICIAL_KEY = 'piggy_banks_v15_pro';

function standaloneState(){
  const a = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  const b = window.navigator.standalone === true;
  return (a || b) ? '是（当前像主屏幕 Web App）' : '否（很可能是普通浏览器页面）';
}

function fmt(ts){
  if(!ts) return '未知';
  const d = new Date(Number(ts));
  if(Number.isNaN(d.getTime())) return String(ts);
  const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}

function analyze(raw){
  let obj;
  try { obj = JSON.parse(raw); } catch(e) { return {json:false}; }
  let banks = null;
  if(Array.isArray(obj)) banks = obj;
  else if(obj && Array.isArray(obj.banks)) banks = obj.banks;
  else if(obj && obj.data && Array.isArray(obj.data.banks)) banks = obj.data.banks;

  if(!banks) return {json:true, piggy:false};

  let assets=0, history=0, latest=0;
  const names=[];
  banks.forEach(b=>{
    if(b && b.name) names.push(b.name);
    if(Array.isArray(b?.assets)){
      assets += b.assets.length;
      b.assets.forEach(a=>{
        latest=Math.max(latest, Number(a?.updatedAt||a?.modifiedAt||a?.time||a?.id||0));
      });
    }
    if(Array.isArray(b?.history)){
      history += b.history.length;
      b.history.forEach(h=>latest=Math.max(latest, Number(h?.time||0)));
    }
    latest=Math.max(latest, Number(b?.updatedAt||b?.modifiedAt||b?.id||0));
  });
  return {json:true,piggy:true,banks:banks.length,assets,history,latest,names:names.slice(0,8)};
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function scan(){
  document.getElementById('env').innerHTML =
    `<b>当前网址：</b>${escapeHtml(location.href)}<br>`+
    `<b>Origin：</b>${escapeHtml(location.origin)}<br>`+
    `<b>主屏幕模式：</b><span class="${standaloneState().startsWith('是')?'good':'bad'}">${standaloneState()}</span><br>`+
    `<b>localStorage 项数：</b>${localStorage.length}`;

  const items=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    items.push({key:k, raw:localStorage.getItem(k)});
  }

  document.getElementById('summary').innerHTML =
    `<b>扫描结果：</b>找到 ${items.length} 个 localStorage key。`+
    (localStorage.getItem(OFFICIAL_KEY) !== null
      ? `<br><span class="good">✓ 找到正式 key：${OFFICIAL_KEY}</span>`
      : `<br><span class="bad">✗ 当前容器没有正式 key：${OFFICIAL_KEY}</span>`);

  const list=document.getElementById('list');
  list.innerHTML='';
  items.sort((a,b)=>{
    if(a.key===OFFICIAL_KEY) return -1;
    if(b.key===OFFICIAL_KEY) return 1;
    return a.key.localeCompare(b.key);
  });

  items.forEach((it,idx)=>{
    const a=analyze(it.raw);
    const card=document.createElement('div');
    card.className='card';

    let details = `<div class="key">${escapeHtml(it.key)} ${it.key===OFFICIAL_KEY?'⭐':''}</div>`;
    details += `<div class="meta">长度：${it.raw?.length||0} 字符`;
    if(a.piggy){
      details += `<br><span class="good">识别为存钱罐数据</span>：${a.banks} 个存钱罐 / ${a.assets} 项资产 / ${a.history} 条历史`;
      details += `<br>存钱罐：${escapeHtml(a.names.join('、')||'未命名')}`;
      details += `<br>推测最近时间：${fmt(a.latest)}`;
    }else if(a.json){
      details += `<br>是 JSON，但未识别成当前存钱罐结构`;
    }else{
      details += `<br>不是 JSON`;
    }
    details += `</div>`;

    details += `<div class="actions">
      <button class="secondary" onclick="exportOne(${idx})">导出这一项</button>
      ${a.piggy && it.key!==OFFICIAL_KEY ? `<button class="primary" onclick="restoreKey(${idx})">恢复到正式 key</button>` : ''}
    </div>`;

    details += `<pre>${escapeHtml((it.raw||'').slice(0,6000))}${(it.raw||'').length>6000?'\n…已截断预览':''}</pre>`;
    card.innerHTML=details;
    list.appendChild(card);
  });

  window.__items = items;
}

function download(name,text,type='application/json'){
  const blob=new Blob([text],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function exportAll(){
  const data={
    exportedAt:new Date().toISOString(),
    href:location.href,
    origin:location.origin,
    standalone:standaloneState(),
    localStorage:{}
  };
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    data.localStorage[k]=localStorage.getItem(k);
  }
  download(`piggy-emergency-all-${Date.now()}.json`,JSON.stringify(data,null,2));
  alert('已导出当前这个 Web App 容器的全部 localStorage。请先保存好这个文件。');
}

function exportOne(idx){
  const it=window.__items[idx];
  if(!it) return;
  download(`piggy-key-${it.key}-${Date.now()}.txt`,it.raw||'','text/plain');
}

function restoreKey(idx){
  const it=window.__items[idx];
  if(!it) return;
  const a=analyze(it.raw);
  if(!a.piggy) return alert('这项不是可识别的存钱罐数据。');

  if(!confirm(`准备把【${it.key}】复制到正式 key：${OFFICIAL_KEY}\n\n会先自动备份当前正式 key。继续吗？`)) return;

  const old=localStorage.getItem(OFFICIAL_KEY);
  if(old!==null){
    const backupKey=`${OFFICIAL_KEY}_before_recovery_${Date.now()}`;
    localStorage.setItem(backupKey,old);
  }
  localStorage.setItem(OFFICIAL_KEY,it.raw);
  alert('已恢复到正式 key。现在先导出全部数据，然后再恢复正常网页代码。');
  scan();
}

scan();
</script>
</body>
</html>
